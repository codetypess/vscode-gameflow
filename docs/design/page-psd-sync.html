<script>
(() => {
  const root = document.getElementById("gf-psd-sync");
  const el = id => root.querySelector("#gf-" + id);
  const skip = ["skip", "本轮跳过", "这项差异留到下次同步。"];
  const changes = {
    help: {kind:"add", origin:"原型新增", base:"双方均无帮助按钮", initial:"push", choices:[
      ["push","补到 PSD","在 PSD 登录页下新增帮助按钮组和文案子层。"],skip]},
    notice: {kind:"add", origin:"PSD 新增", base:"双方均无公告按钮", initial:"pull", choices:[
      ["pull","补到原型","在原型登录页下创建 UIButton 和公告文案，按钮使用内置浅灰资源。"],skip]},
    text: {kind:"edit", origin:"双方修改文案", base:"开始远征", initial:"", choices:[
      ["proto","采用原型","将 PSD 文字改为「继续远征」。"],["art","采用 PSD","将原型文字改为「立即启航」。"],skip]},
    footer: {kind:"delete", origin:"PSD 已删除", base:"适度游戏，探索更多精彩", initial:"skip", choices:[
      ["remove","从原型删除","从原型登录页移除底部提示文字节点。"],["restore","在 PSD 恢复","在 PSD 原位置恢复底部提示文字层。"],skip]}
  };
  // The sample uses the logical hierarchy and variable names from the Star Sea login page.
  const nodes = [
    ["page","登录页","",null], ["bg","背景","background","page"],
    ["deep","深空渐变","deepSpace","bg"], ["stars","星点与轨道","stars","bg"],
    ["title","标题区","titleArea","page"], ["emblem","星海徽记","emblem","title"],
    ["game","游戏标题","gameTitle","title"], ["subtitle","副标题","subtitle","title"],
    ["server","服务器信息","serverInfo","page"], ["serverBg","服务器底板","serverBackground","server"],
    ["status","连接状态灯","connectionStatus","server"], ["serverName","服务器名称","serverLabel","server"],
    ["start","开始远征","startButton","page"], ["text","按钮文案","startLabel","start","text"],
    ["help","帮助按钮","helpButton","page","help"], ["helpText","帮助文案","helpLabel","help","help"],
    ["notice","公告按钮","noticeButton","page","notice"], ["noticeText","公告文案","noticeLabel","notice","notice"],
    ["footer","底部提示","footer","page","footer"]
  ].map(([id,name,variable,parent,change])=>({id,name,variable,parent,change}));
  const byId = new Map(nodes.map(node=>[node.id,node]));
  const keys = Object.keys(changes);
  const signs = {add:"+",delete:"−",edit:"~"};
  const kinds = {add:"新增",delete:"删除",edit:"修改"};
  const defaults = () => Object.fromEntries(keys.map(key=>[key,changes[key].initial]));
  let decisions = defaults(), expanded = new Set(["page","start"]);
  let selected = "help", mode = "current", scenario = "mixed", reviewing = false;
  const mixed = () => scenario === "mixed";
  const visibleInScenario = node => mixed() || !["help","notice"].includes(node.change);
  const choiceFor = key => changes[key].choices.find(option=>option[0]===decisions[key]);
  const activeKey = () => mixed() ? byId.get(selected).change : undefined;
  function restore(snapshot) {
    const state = snapshot?.privateContent;
    if (state?.version !== 3) return;
    decisions = defaults();
    for (const key of keys) {
      if (changes[key].choices.some(option=>option[0]===state.decisions?.[key])) decisions[key]=state.decisions[key];
    }
    scenario = state.scenario === "artOnly" ? "artOnly" : "mixed";
    const node = byId.get(state.selected);
    selected = node && visibleInScenario(node) ? node.id : "page";
    if (Array.isArray(state.expanded)) expanded = new Set(state.expanded.filter(id=>byId.has(id)));
    mode = state.mode === "result" ? "result" : "current";
    reviewing = mixed() && !!state.reviewing && !!decisions.text;
  }
  function remember() {
    const summary = mixed() ? Object.fromEntries(keys.map(key=>[byId.get(key).name,choiceFor(key)?.[1] || "待决定"])) : {待同步:0};
    window.openai?.setWidgetState?.({modelContent:summary,privateContent:{version:3,decisions:{...decisions},expanded:[...expanded],selected,mode,scenario,reviewing}})?.catch(()=>{});
  }
  function nodePath(node) {
    const parts = [];
    for (let current = node; current; current = byId.get(current.parent)) parts.unshift(current.name);
    return parts.join(" ／ ");
  }
  function treeLevel(parent) {
    const children = nodes.filter(node=>node.parent===parent && visibleInScenario(node));
    if (!children.length) return "";
    return '<ul class="gf-tree">'+children.map(node=>{
      const branch = nodes.some(child=>child.parent===node.id && visibleInScenario(child));
      const open = expanded.has(node.id);
      const toggle = branch ? '<button type="button" class="gf-toggle" data-toggle="'+node.id+'" aria-expanded="'+open+'" aria-label="'+(open?"折叠":"展开")+node.name+'">'+(open?"▾":"▸")+'</button>' : '<span class="gf-branch-space"></span>';
      const diff = mixed() && node.change ? changes[node.change].kind : null;
      const mark = diff ? '<b aria-label="'+kinds[diff]+'">'+signs[diff]+'</b>' : '';
      const row = '<button type="button" class="gf-row" data-item="'+node.id+'" aria-pressed="'+(selected===node.id)+'"'+(diff?' data-diff="'+diff+'"':'')+'>'+mark+'<span class="gf-title">'+node.name+'</span>'+(node.variable?'<code>'+node.variable+'</code>':'')+'</button>';
      return '<li><div class="gf-tree-line">'+toggle+row+'</div>'+(branch && open ? treeLevel(node.id) : '')+'</li>';
    }).join("")+'</ul>';
  }
  function board(side) {
    const art = side === "psd", plan = mode === "result";
    let label = mixed() ? (art ? "立即启航" : "继续远征") : "开始远征";
    if (mixed() && plan && decisions.text === "art") label = "立即启航";
    if (mixed() && plan && decisions.text === "proto") label = "继续远征";
    const help = mixed() && (!art || (plan && decisions.help==="push"));
    const notice = mixed() && (art || (plan && decisions.notice==="pull"));
    const footerMissing = mixed() && (art ? !(plan && decisions.footer==="restore") : plan && decisions.footer==="remove");
    const mark = (diff,ids) => (diff ? ' data-diff="'+diff+'"' : '')+' data-selected="'+ids.includes(selected)+'"';
    const sign = diff => diff ? '<span class="gf-sig" aria-label="'+kinds[diff]+'">'+signs[diff]+'</span>' : '';
    const textDiff = mixed() ? "edit" : null;
    const footerDiff = footerMissing ? "delete" : null;
    const current = byId.get(selected);
    const detail = {text:"文案 · "+label,help:help?"登录页 ／ 帮助按钮":"尚无帮助按钮",notice:notice?(art?"登录页 ／ 公告 (UIButton)":"登录页 ／ 公告 · 内置浅灰按钮"):"尚无公告按钮",footer:footerMissing?"原位置 · 此侧已删除":"底部提示 · 文字节点"};
    const caption = !mixed() && selected==="page" ? (art?"按钮底图与光效已更新":"登录页 · 内置资源") : detail[activeKey()] || nodePath(current);
    return '<figure data-side="'+side+'"><figcaption><i></i>'+(art?"美术 PSD":"原型 · 内置资源")+'</figcaption>'+
      '<div class="gf-scene '+(art?'gf-art':'')+'"'+mark(null,["page","bg","deep","stars"])+'>'+
      '<span class="'+(art?'gf-emblem':'gf-wiremark')+'"'+mark(null,["emblem"])+'></span>'+
      '<span class="gf-game-title"'+mark(null,["title","game"])+'>星海远征</span><span class="gf-sub"'+mark(null,["subtitle"])+'>启航，探索未知星域</span>'+
      '<span class="gf-server"'+mark(null,["server","serverBg"])+'><span'+mark(null,["status"])+'>●</span> <span'+mark(null,["serverName"])+'>星港一区</span></span>'+
      '<span class="gf-launch '+(art?'':'gf-builtin')+'"'+mark(textDiff,["text","start"])+'><span>'+sign(textDiff)+label+'</span></span>'+
      (help?'<span class="gf-help gf-builtin"'+mark("add",["help","helpText"])+'>'+sign("add")+'帮助</span>':'')+
      (notice?'<span class="gf-notice '+(art?'':'gf-builtin')+'"'+mark("add",["notice","noticeText"])+'>'+sign("add")+'公告</span>':'')+
      '<span class="gf-foot"'+mark(footerDiff,["footer"])+'>'+sign(footerDiff)+(footerMissing?'底部提示':'适度游戏，探索更多精彩')+'</span>'+
      '</div><div class="gf-value">'+caption+'</div></figure>';
  }
  function actionDetails() {
    const lines = [];
    if (decisions.notice==="pull") lines.push("原型 · 新增公告按钮及文案，使用内置浅灰按钮。");
    if (decisions.text==="art") lines.push("原型 · 按钮文案改为「立即启航」。");
    if (decisions.footer==="remove") lines.push("原型 · 删除底部提示。");
    if (decisions.help==="push") lines.push("PSD 副本 · 新增帮助按钮组及文案。");
    if (decisions.text==="proto") lines.push("PSD 副本 · 按钮文案改为「继续远征」。");
    if (decisions.footer==="restore") lines.push("PSD 副本 · 恢复底部提示文字层。");
    if (decisions.help==="push" || decisions.text==="proto" || decisions.footer==="restore") lines.push("页面绑定 · 验证并绑定新 PSD 副本。");
    for (const key of keys.filter(key=>decisions[key]==="skip")) lines.push("下次继续 · "+byId.get(key).name);
    return lines;
  }
  function render() {
    const focused = document.activeElement?.dataset || {};
    const node = byId.get(selected), key = activeKey(), change = changes[key];
    el("scenario").value = scenario;
    el("total").textContent = (mixed()?keys.length:0)+" 项差异";
    el("items").innerHTML = treeLevel(null);
    el("baseline").hidden = !change;
    el("decision").hidden = !change;
    el("modes").hidden = !mixed();
    el("apply").hidden = !mixed();
    el("name").textContent = !mixed() && selected==="page" ? "文字与结构已一致" : node.name;
    el("base").textContent = change?.base || "";
    el("pair").innerHTML = board("proto")+board("psd");
    for (const button of root.querySelectorAll("[data-mode]")) button.setAttribute("aria-pressed",String(button.dataset.mode===mode));
    el("options").innerHTML = (change?.choices || []).map(([id,label])=>'<button type="button" data-choice="'+id+'" aria-pressed="'+(id===decisions[key])+'">'+label+'</button>').join("");
    if (change) {
      const target = node.id===key ? "" : "随"+byId.get(key).name+"一起处理。";
      el("impact").textContent = change.origin+" · "+target+(choiceFor(key)?.[2] || "选择本轮采用的文案，或留到下次处理。");
    }
    const skipped = keys.filter(id=>decisions[id]==="skip").length;
    const pending = keys.filter(id=>!decisions[id]).length;
    el("count").textContent = mixed() ? "待决定 "+pending+" 项　·　已选 "+(keys.length-pending-skipped)+" 项　·　跳过 "+skipped+" 项" : "待同步 0 项";
    el("apply").disabled = pending>0;
    el("apply").textContent = reviewing?"返回调整":"预演应用";
    el("review").hidden = !reviewing;
    el("summary").innerHTML = reviewing?"<ul>"+actionDetails().map(line=>"<li>"+line+"</li>").join("")+"</ul>":"";
    for (const name of ["item","toggle","choice"]) {
      if (focused[name]) root.querySelector('[data-'+name+'="'+focused[name]+'"]')?.focus({preventScroll:true});
    }
  }
  el("scenario").addEventListener("change",event=>{
    scenario=event.target.value;
    selected=mixed()?"help":"page";
    expanded.add("page");
    reviewing=false;
    render(); remember();
  });
  root.addEventListener("click",event=>{
    const button=event.target.closest("button");
    if (!button || button.disabled) return;
    const {toggle,item,mode:nextMode,choice}=button.dataset;
    if (toggle) {
      if (expanded.has(toggle)) {
        expanded.delete(toggle);
        for (let ancestor=byId.get(selected); ancestor; ancestor=byId.get(ancestor.parent)) {
          if (ancestor.id===toggle) {selected=toggle; break;}
        }
      } else expanded.add(toggle);
    } else if (item) selected=item;
    else if (nextMode) mode=nextMode;
    else if (choice && activeKey()) {decisions[activeKey()]=choice; mode="result"; reviewing=false;}
    else if (button===el("apply")) {reviewing=!reviewing; if (reviewing) mode="result";}
    render(); remember();
  });
  restore(window.openai?.widgetState);
  render();
  window.addEventListener("openai:set_globals",event=>{
    if (event.detail?.globals?.widgetState) {restore(event.detail.globals.widgetState);render();}
  });
})();
</script>
