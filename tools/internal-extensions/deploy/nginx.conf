server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /catalog.json { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location /releases/ { add_header Cache-Control "public, max-age=31536000, immutable" always; default_type application/octet-stream; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}